<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prevención Pulso</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prevención">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #000; }
  #carga { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; color: #e6e6e6; font: 16px system-ui, sans-serif; transition: opacity .4s; text-align: center; padding: 20px; }
  .anillo { position: relative; width: 120px; height: 120px; } .anillo img { position: absolute; inset: 6px; width: 108px; height: 108px; border-radius: 50%; }
  #carga i { position: absolute; inset: 0; box-sizing: border-box; width: 120px; height: 120px; border: 4px solid rgba(255,255,255,.2); border-top-color: #FF7617; border-radius: 50%; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="carga"><div class="anillo"><img src="logo-carga.jpg" alt=""><i></i></div><span>Cargando…</span></div>
<iframe title="Prevención Pulso" allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *"
  onload="if(!this.src)return;var c=document.getElementById('carga');if(c){c.style.opacity=0;setTimeout(function(){c.remove()},450)}"></iframe>
<script>(function(){
  var F=['Ajustando el casco…','Revisando el arnés…','¡Disfruta vivir conectado!','Buscando señal…','Desenrollando la fibra…','Contando los conos…','Calentando el café…','Seguridad primero, ya casi…'],i=Math.floor(Math.random()*F.length);
  var t=setInterval(function(){var m=document.querySelector('#carga span');if(!m){clearInterval(t);return}m.textContent=F[i++%F.length]},2000);
  var u='https://script.google.com/macros/s/AKfycby5wuKN-9p3QolyEMw_MgyjRtsmebEZtAmJc-Ul8x7weZwijV4svn-a5PlK3RehWMRo/exec';
  document.querySelector('iframe').src=u;
})();</script>
</body>
</html>
