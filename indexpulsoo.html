<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Pulso</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Pulso">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #000; }
  #carga { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; color: #e6e6e6; font: 16px system-ui, sans-serif; transition: opacity .4s; text-align: center; padding: 20px; }
  #carga img { width: 110px; height: 110px; border-radius: 50%; }
  #carga i { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.2); border-top-color: #FF7617; border-radius: 50%; animation: g 1s linear infinite; }
  #carga a { color: #FF7617; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="carga"><img src="../logo-carga.jpg" alt=""><i></i><span>Cargando…</span></div>
<iframe title="Panel Pulso" allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *"
  onload="if(!this.src)return;var c=document.getElementById('carga');if(c){c.style.opacity=0;setTimeout(function(){c.remove()},450)}"></iframe>
<script>(function(){
  var F=['Ordenando los tickets…','Revisando la agenda de hoy…','Contando equipos en bodega…','Llamando al técnico…','Cuadrando la caja chica…','¡Disfruta vivir conectado!'],i=Math.floor(Math.random()*F.length);
  var t=setInterval(function(){var m=document.querySelector('#carga span');if(!m){clearInterval(t);return}m.textContent=F[i++%F.length]},2000);
  var u=window.URL_SCRIPT||'https://script.google.com/macros/s/AKfycby5wuKN-9p3QolyEMw_MgyjRtsmebEZtAmJc-Ul8x7weZwijV4svn-a5PlK3RehWMRo/exec';
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){clearInterval(t);document.querySelector('#carga span').innerHTML='Falta configurar el enlace de la app en <b>config.js</b>.';document.querySelector('#carga i').remove();return}
  var src=u + '?p=admin';
  var m=location.hash.match(/c=([A-Za-z0-9]+)/);
  if(m){src+=(src.indexOf('?')<0?'?':'&')+'c='+m[1];try{history.replaceState(null,'',location.pathname)}catch(e){}}
  document.querySelector('iframe').src=src;
})();</script>
</body>
</html>
